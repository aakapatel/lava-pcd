[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lava-pcd"
version = "0.1.0"
description = "Tools for processing large point cloud files (convert, downsample, voxelize, crop, merge)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nikolaos Stathoulopoulos", email = "nikolaos.stathoulopoulos@ltu.se" }]
dependencies = [
    "laspy[lazrs,laszip]>=2.5",
    "numpy>=1.26",
    "typer>=0.12",
    "tqdm>=4.6",
    "pyproj>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lava-pcd = "lava_pcd.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
